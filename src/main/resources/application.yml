server:
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
    context-path: /openapi/dev
  port: 8080

spring:
  application:
    name: kyc-verification-system
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  config:
#    activate.on-profile: kyc-verification-system
    name: kyc-verification-system-YAML
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    schema: public
    driver-class-name: org.postgresql.Driver
    type: org.apache.tomcat.jdbc.pool.DataSource
    tomcat:
      max-wait: 20000
      max-active: 300
      max-idle: 10
      min-idle: 5
      initial-size: 2
      test-on-connect: true
      test-on-borrow: true
      validation-query: SELECT 1
      validation-query-timeout: 10
      validation-interval: 15000
      remove-abandoned: false
      remove-abandoned-timeout: 30
      jmx-enabled: true
  jpa:
    timeout-sec: 30
    generate-ddl: false
#  jackson:
#    serialization:
#      write-dates-as-timestamps: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [${spring.zipkin.service.name:${spring.application.name:-}},%X{traceId:-},%X{spanId:-}] [%t] %-5level %logger{36} - %msg%n"
  level:
    root: info
    web: info
    org:
      hibernate:
        type:
        descriptor:
        sql:
        BasicBinder: info
        SQL: info
      springframework: info
      apache.tomcat.jdbc.pool: info
    com.oracle.fcr.ngi: info

rest:
  config:
    timeout-millis: 30000

---
environment: dev
---

# Actuators properties
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*' # ["metrics", "prometheus", "circuitbreakers", "circuitbreakerevents"]
  endpoint:
    health:
      show-details: always

# resilience4j properties
resilience4j:
  circuitbreaker:
    instances:
      acct-transfer:
        registerHealthIndicator: true
        event-consumer-buffer-size: 10
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 3s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

